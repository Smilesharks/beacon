name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        statamic: ['^4.0', '^5.0']

    name: PHP ${{ matrix.php }} / Statamic ${{ matrix.statamic }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          composer require "statamic/cms:${{ matrix.statamic }}" --no-update
          composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test
